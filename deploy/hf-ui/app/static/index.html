<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab Models</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Lab Catalog</p>
          <h1>Models and Datasets</h1>
        </div>
        <div class="userbar">
          <span id="user-status">Checking session</span>
          <a id="login-link" class="button" href="/login">Sign in</a>
          <a id="logout-link" class="icon-link" href="/logout" hidden>Sign out</a>
        </div>
      </header>

      <main class="layout">
        <aside class="sidebar">
          <div class="control">
            <label for="search">Search</label>
            <input id="search" type="search" placeholder="model, dataset, tag">
          </div>
          <div class="tabs" role="tablist" aria-label="Catalog type">
            <button id="tab-models" class="active" type="button">Models</button>
            <button id="tab-datasets" type="button">Datasets</button>
          </div>
          <div id="list" class="list" aria-live="polite"></div>
        </aside>

        <section class="detail" aria-live="polite">
          <div id="empty" class="empty">
            <h2>Select an item</h2>
            <p>Catalog entries are indexed metadata. Files are read directly from MinIO.</p>
          </div>
          <article id="detail" hidden>
            <div class="detail-head">
              <div>
                <p id="detail-kind" class="eyebrow"></p>
                <h2 id="detail-title"></h2>
                <p id="detail-summary"></p>
              </div>
              <div id="detail-tags" class="tags"></div>
            </div>
            <div class="meta-grid">
              <div><span>Owner</span><strong id="detail-owner"></strong></div>
              <div><span>Version</span><strong id="detail-version"></strong></div>
              <div><span>License</span><strong id="detail-license"></strong></div>
              <div><span>Storage</span><strong id="detail-storage"></strong></div>
            </div>
            <section>
              <h3>README</h3>
              <div id="readme" class="readme"></div>
            </section>
            <section id="preview-section" hidden>
              <div class="section-title">
                <h3>Preview <span class="sample-badge">Sample-based</span></h3>
                <div id="preview-meta" class="preview-meta"></div>
              </div>
              <div id="preview-files" class="preview-files"></div>
              <div id="preview-warnings" class="preview-warnings"></div>
              <div id="preview-data" class="preview-data"></div>
            </section>
            <section>
              <div class="section-title">
                <h3>Files</h3>
              </div>
              <form id="upload-form" class="upload-form">
                <div class="upload-fields">
                  <div class="control">
                    <label for="upload-file">Upload file</label>
                    <input id="upload-file" type="file">
                  </div>
                  <div class="control">
                    <label for="upload-path">Target path</label>
                    <input id="upload-path" type="text" placeholder="path/in/repository.ext">
                  </div>
                </div>
                <div class="upload-actions">
                  <label class="check-control">
                    <input id="upload-overwrite" type="checkbox">
                    <span>Overwrite existing file</span>
                  </label>
                  <button id="upload-submit" type="submit">Upload</button>
                </div>
                <div class="upload-progress" aria-live="polite">
                  <progress id="upload-progress" value="0" max="100" hidden></progress>
                  <span id="upload-status"></span>
                </div>
              </form>
              <div id="files" class="files"></div>
            </section>
          </article>
        </section>
      </main>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
