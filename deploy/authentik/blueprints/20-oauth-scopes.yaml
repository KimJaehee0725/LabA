version: 1
metadata:
  name: lab-oauth-scopes
entries:
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: lab-groups
    attrs:
      name: lab-groups
      scope_name: groups
      description: Add Authentik group names to OIDC claims.
      expression: |
        return {
            "groups": [group.name for group in user.ak_groups.all()],
        }
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: lab-minio-policy
    attrs:
      name: lab-minio-policy
      scope_name: policy
      description: Map Authentik lab groups to MinIO policy names.
      expression: |
        groups = {group.name for group in user.ak_groups.all()}
        if "lab-admin" in groups:
            policy = "consoleAdmin"
        elif {"lab-member", "lab-collab"}.intersection(groups):
            policy = "lab-storage-member-rw"
        else:
            policy = ""
        return {"policy": policy}
