user nginx;
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    resolver 127.0.0.11 ipv6=off valid=30s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Phase 2 Edge/Auth staging loads only the active baseline routes.
    include /etc/nginx/conf.d/00-http-redirect.conf;
    include /etc/nginx/conf.d/10-authentik.conf;
    include /etc/nginx/conf.d/20-huly.conf;
    include /etc/nginx/conf.d/30-minio-storage.conf;
    include /etc/nginx/conf.d/45-hf-ui.conf;
    include /etc/nginx/conf.d/70-overleaf.conf;
}
