server {
    listen 443 ssl;
    server_name lab.snu.ac.kr;

    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 1G;

    location /api/ {
        set $plane_api http://plane-api:8000;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass $plane_api;
    }

    location /auth/ {
        set $plane_api http://plane-api:8000;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass $plane_api;
    }

    location = /plane-uploads {
        set $plane_minio http://minio:9000;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_request_buffering off;
        proxy_pass $plane_minio/plane-uploads/;
    }

    location /plane-uploads/ {
        set $plane_minio http://minio:9000;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_request_buffering off;
        proxy_pass $plane_minio;
    }

    location /spaces/ {
        set $plane_space http://plane-space:3000;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass $plane_space;
    }

    location /god-mode/ {
        set $plane_admin http://plane-admin:3000;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass $plane_admin;
    }

    location /live/ {
        set $plane_live http://plane-live:3000;
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/websocket.conf;
        proxy_pass $plane_live;
    }

    location / {
        set $plane_web http://plane-web:3000;
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/websocket.conf;
        proxy_pass $plane_web;
    }
}
