server {
    listen 443 ssl;
    server_name huly.lab.example.ac.kr;

    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 1G;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location /_accounts {
        set $huly_account http://huly-account:3000;
        include /etc/nginx/snippets/proxy-params.conf;
        rewrite ^/_accounts(/.*)$ $1 break;
        proxy_pass $huly_account/;
    }

    location /_transactor {
        set $huly_transactor http://huly-transactor:3333;
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/websocket.conf;
        rewrite ^/_transactor(/.*)$ $1 break;
        proxy_pass $huly_transactor/;
    }

    location ~ ^/eyJ {
        set $huly_transactor http://huly-transactor:3333;
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/websocket.conf;
        proxy_pass $huly_transactor;
    }

    location /_collaborator {
        set $huly_collaborator http://huly-collaborator:3078;
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/websocket.conf;
        rewrite ^/_collaborator(/.*)$ $1 break;
        proxy_pass $huly_collaborator/;
    }

    location /_rekoni {
        set $huly_rekoni http://huly-rekoni:4004;
        include /etc/nginx/snippets/proxy-params.conf;
        rewrite ^/_rekoni(/.*)$ $1 break;
        proxy_pass $huly_rekoni/;
    }

    location /_stats {
        set $huly_stats http://huly-stats:4900;
        include /etc/nginx/snippets/proxy-params.conf;
        rewrite ^/_stats(/.*)$ $1 break;
        proxy_pass $huly_stats/;
    }

    location /_github {
        set $huly_github http://huly-github:3500;
        include /etc/nginx/snippets/proxy-params.conf;
        rewrite ^/_github(/.*)$ $1 break;
        proxy_pass $huly_github/;
    }

    location /_calendar {
        set $huly_calendar http://huly-calendar:8095;
        include /etc/nginx/snippets/proxy-params.conf;
        rewrite ^/_calendar(/.*)$ $1 break;
        proxy_pass $huly_calendar/;
    }

    location = /files {
        set $huly_minio http://huly-minio:9000;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass $huly_minio;
    }

    location /files/ {
        set $huly_minio http://huly-minio:9000;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_request_buffering off;
        proxy_pass $huly_minio;
    }

    location / {
        set $huly_front http://huly-front:8080;
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/websocket.conf;
        proxy_pass $huly_front;
    }
}
