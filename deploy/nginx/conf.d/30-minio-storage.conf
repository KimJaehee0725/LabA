server {
    listen 443 ssl;
    server_name files.lab.example.ac.kr;

    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/upload-large.conf;

    client_max_body_size 1G;

    location / {
        set $minio_console http://minio:9001;
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/websocket.conf;
        proxy_pass $minio_console;
    }
}

server {
    listen 443 ssl;
    server_name s3.lab.example.ac.kr;

    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/upload-large.conf;

    client_max_body_size 0;

    location / {
        set $minio_api http://minio:9000;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_request_buffering off;
        proxy_pass $minio_api;
    }
}
