      name: Research Ops
      group_ref: lab-member
      stacks:
        - Backlog
        - Doing
        - Done
      cards:
        - title: Confirm Grist OIDC smoke
          stack: Backlog
          due: "2026-05-12"
          description: Run 76-check-grist.sh and confirm the OIDC gate plus API seed.
        - title: Review document hub entry points
          stack: Doing
          due: "2026-05-13"
          description: Open Files, Collectives, Deck, Calendar, and Grist links after Authentik login.
        - title: Keep GitHub integration user-scoped
          stack: Done
          due: "2026-05-09"
          description: Install integration_github but keep PAT/OAuth setup in each user's Connected accounts.
  calendars:
    - id: research-demo-calendar
      phase: seed
      system_of_record: Nextcloud Calendar
      uri: research-demo
      name: Research Demo
      owner_env: NEXTCLOUD_SEED_USER

