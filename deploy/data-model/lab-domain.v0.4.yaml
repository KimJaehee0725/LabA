code_repositories:
  - id: lab-platform-demo
    phase: seed
    system_of_record: Gitea
    owner_env: DEMO_GITEA_OWNER
    name: lab-platform-demo
    description: Staging platform demo notes for the current deployment wave.
    visibility: public
    default_branch: main
    files:
      - path: README.md
        message: Seed demo README
        content: |
          # Lab Platform Demo

          This repository is demo data for the staging Lab Platform.

          It gives visitors a quick, non-sensitive walkthrough of the current platform wave:

          - Authentik identity foundation
          - Gitea source hosting
          - Plane project tracking
          - MLflow experiment tracking
          - Nextcloud/Collabora document hub
          - Grist structured research hub

          Do not store real credentials or research data here.
      - path: docs/v0.4-workspace.md
        message: Seed v0.4 workspace note
        content: |
          # v0.4 Research Workspace

          v0.4 uses Plane for work items, Nextcloud Collectives for pages, and Grist for structured research data and dashboards.

          GitHub links are explicit URL fields. User GitHub PATs stay in each user's connected accounts, not in server env files or seed data.
  - id: vision-baseline-demo
    phase: seed
    system_of_record: Gitea
    owner_env: DEMO_GITEA_OWNER
    name: vision-baseline-demo
    description: Small public sample repository for a lab model baseline.
    visibility: public
    default_branch: main
    files:
      - path: README.md
        message: Seed vision demo README
        content: |
          # Vision Baseline Demo

          This is placeholder demo content for a lab code repository.

          It is intentionally small and contains no private dataset, model weight, or credential.
      - path: train.py
        message: Seed sample training script
        content: |
          def main():
              metrics = {"accuracy": 0.91, "loss": 0.23}
              for key, value in metrics.items():
                  print(f"{key}: {value}")


          if __name__ == "__main__":
              main()
      - path: metrics/sample-run.json
        message: Seed sample metrics
        content: |
          {
            "run_name": "demo-baseline-001",
            "accuracy": 0.91,
            "loss": 0.23,
            "notes": "Synthetic demo metrics only"
          }
  - id: paper-template-demo
    phase: seed
    system_of_record: Gitea
    owner_env: DEMO_GITEA_OWNER
    name: paper-template-demo
    description: Minimal paper template for the collaboration app wave demo.
    visibility: public
    default_branch: main
    files:
      - path: README.md
        message: Seed paper template README
        content: |
          # Paper Template Demo

          This repository is demo content for the future Overleaf/collaboration wave.
      - path: main.tex
        message: Seed paper template
        content: |
          \documentclass{article}
          \title{Lab Platform Demo Paper}
          \author{Demo Member}
          \begin{document}
          \maketitle
          \section{Overview}
          This is a synthetic paper template for the staging demo.
          \end{document}

lab_users:
  - id: demo-member
    phase: seed
    system_of_record: Authentik
    username: demo.member
    email: demo.member@example.invalid
    display_name: Demo Member
    groups:
      - lab-member

plane:
  workspaces:
    - id: lab-demo
      phase: seed
      system_of_record: Plane
      slug: lab-demo
      name: Lab Demo Workspace
      owner_ref: demo-member
      auth_mode: authentik-oidc-primary
      timezone: Asia/Seoul
      organization_size: 1-10
      states:
        - name: Backlog
          group: backlog
          color: "#6B7280"
          default: true
        - name: Ready
          group: unstarted
          color: "#2563EB"
          default: false
        - name: In Progress
          group: started
          color: "#F59E0B"
          default: false
        - name: Done
          group: completed
          color: "#16A34A"
          default: false
      projects:
        - id: platform-rollout
          phase: seed
          system_of_record: Plane
          name: Platform Rollout
          identifier: ROLL
          description: Demo project for staging rollout tasks.
          issues:
            - name: Confirm Grist Authentik OIDC login
              priority: high
              state: Ready
              due_date: "2026-05-12"
              labels:
                - sso
                - grist
              description: Confirm Authentik login reaches the Lab Research Hub Grist document.
              collectives_page_ref: platform-rollout-page
              grist_table_ref: Projects
              grist_record_key: Platform Rollout
              github_ref: grist-core
            - name: Review user-scoped GitHub connected accounts policy
              priority: medium
              state: Done
              due_date: "2026-05-09"
              labels:
                - policy
                - github
              description: Keep GitHub PATs out of server env, reports, history, and seed data.
              collectives_page_ref: lab-home
              grist_table_ref: GitHubRefs
              grist_record_key: grist-core
            - name: Prepare v0.4 integrated smoke
              priority: medium
              state: Backlog
              due_date: "2026-05-14"
              labels:
                - smoke
              description: Run 96-check-all.sh with core,edge,authentik,gitea,plane,mlflow,nextcloud,grist.
        - id: research-workbench
          phase: seed
          system_of_record: Plane
          name: Research Workbench
          identifier: RND
          description: Demo project for research workflow tasks.
          issues:
            - name: Seed Lab Research Hub tables
              priority: high
              state: In Progress
              due_date: "2026-05-13"
              labels:
                - data-model
                - workspace
              description: Create Grist People, Teams, Projects, Resources, Papers, Datasets, Experiments, GitHubRefs, Events, and dashboard rows.
              collectives_page_ref: research-workbench-page
              grist_table_ref: DashboardPages
              grist_record_key: Research Overview
            - name: Upload sanitized sample dataset
              priority: low
              state: Backlog
              due_date: "2026-05-17"
              labels:
                - dataset
              description: Use synthetic data only for staging demos.
            - name: Write reproducibility note
              priority: medium
              state: Done
              due_date: "2026-05-11"
              labels:
                - docs
              description: Document how the demo result can be reproduced and link the Grist experiment row.

