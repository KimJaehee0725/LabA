catalog_version: v0.4
kind: lab-domain-catalog
metadata:
  name: lab-domain
  description: Non-secret v0.4 research workspace catalog for Plane, Nextcloud Collectives, and Grist.
  owner: lab-platform
  strict_oss_policy: Core functionality uses OSS editions only; do not depend on paid/enterprise-only integrations.
  secret_policy: Secrets, API keys, OAuth client secrets, and GitHub PATs remain only in /srv/lab-platform/env/*.env or user-scoped connected accounts.

responsibility_split:
  plane:
    canonical_scope: Work and task execution.
    owns:
      - assignees
      - due dates
      - project, module, cycle, and status views
      - task activity
  nextcloud_collectives:
    canonical_scope: Page, wiki, and document hub.
    owns:
      - lab pages
      - meeting notes
      - SOPs
      - onboarding
      - experiment notes
      - page links
  grist:
    canonical_scope: Structured database and dashboard layer.
    owns:
      - people
      - teams
      - projects
      - resources
      - papers
      - datasets
      - experiments
      - GitHub references
      - review queue
      - dashboard definitions
  nextcloud_calendar:
    canonical_scope: Team calendars.
    owns:
      - shared lab calendars
      - recurring events
    note: Grist may mirror important date records, but calendar ownership stays in Nextcloud.

lab_groups:
  - id: lab-member
    phase: seed
    system_of_record: Authentik
    name: lab-member
    description: Default non-admin lab member group.
