name: lab_edge

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${LAB_STACK_ROOT}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${LAB_STACK_ROOT}/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${LAB_STACK_ROOT}/nginx/snippets:/etc/nginx/snippets:ro
      - ${LAB_STACK_ROOT}/certs:/etc/nginx/ssl:ro
      - ${LAB_STACK_ROOT}/logs/nginx:/var/log/nginx
    networks:
      - labstack_public
      - labstack_backend
      - labstack_data
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  labstack_public:
    external: true
    name: ${LABSTACK_PUBLIC_NETWORK}
  labstack_backend:
    external: true
    name: ${LABSTACK_BACKEND_NETWORK}
  labstack_data:
    external: true
    name: ${LABSTACK_DATA_NETWORK}
