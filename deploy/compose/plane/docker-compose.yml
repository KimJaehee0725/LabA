name: lab_plane

services:
  plane-web:
    image: ${PLANE_WEB_IMAGE}
    build:
      context: ./custom
      dockerfile: Dockerfile.web
      args:
        PLANE_SOURCE_REF: ${PLANE_SOURCE_REF:-f70eae2f3be48b3cfb6ed579ef587c2a86a1c56b}
        NEXT_PUBLIC_WEB_BASE_URL: ${PLANE_WEB_URL}
        NEXT_PUBLIC_ADMIN_BASE_PATH: /god-mode
        NEXT_PUBLIC_LIVE_BASE_PATH: /live
        NEXT_PUBLIC_SPACE_BASE_PATH: /spaces
    container_name: plane-web
    restart: unless-stopped
    command: node /app/web/server.js
    environment:
      TZ: ${TZ}
      WEB_URL: ${PLANE_WEB_URL}
    networks:
      - lab_backend

  plane-space:
    image: ${PLANE_SPACE_IMAGE}
    container_name: plane-space
    restart: unless-stopped
    command: node /app/space/server.js
    environment:
      TZ: ${TZ}
      WEB_URL: ${PLANE_WEB_URL}
    networks:
      - lab_backend

  plane-admin:
    image: ${PLANE_ADMIN_IMAGE}
    container_name: plane-admin
    restart: unless-stopped
    command: node /app/admin/server.js
    environment:
      TZ: ${TZ}
      WEB_URL: ${PLANE_WEB_URL}
    networks:
      - lab_backend

  plane-api:
    image: ${PLANE_API_IMAGE}
    build:
      context: ./custom
      dockerfile: Dockerfile.backend
      args:
        PLANE_SOURCE_REF: ${PLANE_SOURCE_REF:-f70eae2f3be48b3cfb6ed579ef587c2a86a1c56b}
    container_name: plane-api
    restart: unless-stopped
    command: /code/bin/docker-entrypoint-api.sh
    environment:
      TZ: ${TZ}
      WEB_URL: ${PLANE_WEB_URL}
      PORT: 8000
      GUNICORN_WORKERS: ${PLANE_GUNICORN_WORKERS:-2}
      DATABASE_URL: postgresql://${PLANE_DB_USER}:${PLANE_DB_PASSWORD}@postgres:5432/${PLANE_DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/${PLANE_REDIS_DB}
      AMQP_URL: redis://:${REDIS_PASSWORD}@redis:6379/${PLANE_REDIS_DB}
      SECRET_KEY: ${PLANE_SECRET_KEY}
      USE_MINIO: "1"
      AWS_ACCESS_KEY_ID: ${PLANE_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${PLANE_S3_SECRET_KEY}
      AWS_S3_BUCKET_NAME: ${PLANE_S3_BUCKET}
      AWS_S3_ENDPOINT_URL: ${PLANE_S3_ENDPOINT}
      AWS_REGION: ${PLANE_S3_REGION}
      OIDC_DISCOVERY_URL: ${PLANE_OIDC_DISCOVERY_URL}
      OIDC_CLIENT_ID: ${PLANE_OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${PLANE_OIDC_CLIENT_SECRET}
      OIDC_SCOPES: ${PLANE_OIDC_SCOPES:-openid email profile groups}
      OIDC_VERIFY_SSL: ${PLANE_OIDC_VERIFY_SSL:-1}
      OIDC_PROVIDER_LABEL: ${PLANE_OIDC_PROVIDER_LABEL:-Authentik}
      ENABLE_SIGNUP: ${PLANE_ENABLE_SIGNUP:-0}
      ENABLE_EMAIL_PASSWORD: ${PLANE_ENABLE_EMAIL_PASSWORD:-1}
      DISABLE_WORKSPACE_CREATION: ${PLANE_DISABLE_WORKSPACE_CREATION:-0}
      ENABLE_MAGIC_LINK_LOGIN: ${PLANE_ENABLE_MAGIC_LINK_LOGIN:-0}
      IS_INTERCOM_ENABLED: ${PLANE_IS_INTERCOM_ENABLED:-0}
      FILE_SIZE_LIMIT: ${PLANE_FILE_SIZE_LIMIT:-5242880}
    networks:
      - lab_backend
      - lab_data

  plane-migrator:
    image: ${PLANE_API_IMAGE}
    container_name: plane-migrator
    restart: "no"
    command: /code/bin/docker-entrypoint-migrator.sh
    environment:
      TZ: ${TZ}
      DATABASE_URL: postgresql://${PLANE_DB_USER}:${PLANE_DB_PASSWORD}@postgres:5432/${PLANE_DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/${PLANE_REDIS_DB}
      AMQP_URL: redis://:${REDIS_PASSWORD}@redis:6379/${PLANE_REDIS_DB}
      SECRET_KEY: ${PLANE_SECRET_KEY}
      USE_MINIO: "1"
    networks:
      - lab_data

  plane-worker:
    image: ${PLANE_API_IMAGE}
    container_name: plane-worker
    restart: unless-stopped
    command: /code/bin/docker-entrypoint-worker.sh
    environment:
      TZ: ${TZ}
      DATABASE_URL: postgresql://${PLANE_DB_USER}:${PLANE_DB_PASSWORD}@postgres:5432/${PLANE_DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/${PLANE_REDIS_DB}
      AMQP_URL: redis://:${REDIS_PASSWORD}@redis:6379/${PLANE_REDIS_DB}
      SECRET_KEY: ${PLANE_SECRET_KEY}
      USE_MINIO: "1"
      AWS_ACCESS_KEY_ID: ${PLANE_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${PLANE_S3_SECRET_KEY}
      AWS_S3_BUCKET_NAME: ${PLANE_S3_BUCKET}
      AWS_S3_ENDPOINT_URL: ${PLANE_S3_ENDPOINT}
      AWS_REGION: ${PLANE_S3_REGION}
      FILE_SIZE_LIMIT: ${PLANE_FILE_SIZE_LIMIT:-5242880}
    networks:
      - lab_data

  plane-beat:
    image: ${PLANE_API_IMAGE}
    container_name: plane-beat
    restart: unless-stopped
    command: /code/bin/docker-entrypoint-beat.sh
    environment:
      TZ: ${TZ}
      DATABASE_URL: postgresql://${PLANE_DB_USER}:${PLANE_DB_PASSWORD}@postgres:5432/${PLANE_DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/${PLANE_REDIS_DB}
      AMQP_URL: redis://:${REDIS_PASSWORD}@redis:6379/${PLANE_REDIS_DB}
      SECRET_KEY: ${PLANE_SECRET_KEY}
    networks:
      - lab_data

  plane-live:
    image: ${PLANE_LIVE_IMAGE}
    container_name: plane-live
    restart: unless-stopped
    command: node /app/live/dist/server.js
    environment:
      TZ: ${TZ}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/${PLANE_REDIS_DB}
    networks:
      - lab_backend
      - lab_data

networks:
  lab_backend:
    external: true
  lab_data:
    external: true
